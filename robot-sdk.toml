# robot-sdk declaration: the shared types this package's public API takes (consumes) and gives (produces),
# each with the symbols that are the contract. Checked against the code by robot_sdk's
# `python -m tools.sdk_graph check` (docs/graph-schema.md in github.com/zacharyyamaoka/robot_sdk).
schema = "robot-sdk-declaration/1"
role = "viewer"
layer = "viewers"
one_line = "A/B trajectory comparison report; a runs workbench over many sites; trajectory and grasp coverage viewers"
summary = "Viewers on robot_msgs types, in three parts. Comparison: a turn-key A/B trajectory viewer that writes one static `report.html` (target vs sim vs real). Trajectory coverage (`traj_compare.coverage`: how much of a robot's joint limits, workspace and tool orientations a set of trajectories visits) and grasp coverage (`traj_compare.grasp_coverage`: how much of a gripper's jaw range, approach directions, rolls and offered area a set of GraspPose uses, and where the failures sat), each one payload feeding a data-ui workbench, Matplotlib, Viser and W&B; grasp coverage is also deployed as its own grasp dataset viewer (`grasp_viewer` link). Coverage of any list of dataclass records moved to its own package, dataclass_coverage."
use_when = "Comparing runs (target vs sim vs real, before vs after), benchmark reports, \"how much of the space does this trajectory or grasp dataset cover?\". **Never write a bespoke trajectory plot or coverage page.**"

# Where to read more. github and pypi are required; the rest are what this package has.
[links]
github = "https://github.com/zacharyyamaoka/trajectory_comparison_viewer"
site = "https://zacharyyamaoka.github.io/trajectory_comparison_viewer/"
pypi = "https://pypi.org/project/traj-compare/"
grasp_viewer = "https://grasp-viewer.zach-yamaoka.workers.dev"

[[consumes]]
type = "robot_msgs.compare.Tolerances"
symbols = [
  "traj_compare.model.Comparison.tolerances",
]

[[consumes]]
type = "robot_msgs.manipulation.GraspPose"
symbols = [
  "traj_compare.grasp_coverage.analysis.grasp_values",
]

[[consumes]]
type = "robot_msgs.trajectory.JointLimits"
symbols = [
  "traj_compare.coverage.analysis.analyze",
]

[[consumes]]
type = "robot_msgs.trajectory.JointTrajectory"
symbols = [
  "traj_compare.dataset.Run.reference",
  "traj_compare.dataset.Run.measured",
  "traj_compare.data_ui.write_tables",
]

[[produces]]
type = "robot_msgs.trajectory.JointTrajectory"
symbols = [
  "traj_compare.dataset.Run.series",
  "traj_compare.data_ui.links_from_robot",
]

[[consumes]]
type = "robot_msgs.trajectory.PoseTrajectory"
symbols = [
  "traj_compare.data_ui.write_tables",
]

[[produces]]
type = "robot_msgs.trajectory.PoseTrajectory"
symbols = [
  "traj_compare.data_ui.links_from_robot",
]
