<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coverage · Focus rail</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- V5 "Focus rail" (babble round 2026-11-24): keep the whole dataset on screen, and let a trajectory list on the left
     light up what any trajectory (or a few) contributes, everywhere at once. Hand-rolled; reads only ../data/. -->
<div class="app" data-v5-app>
  <header class="top">
    <div class="brand" aria-hidden="true">
      <svg viewBox="0 0 20 20" width="20" height="20"><rect x="1" y="1" width="8" height="8" rx="1.5" fill="#3b528b"/><rect x="11" y="1" width="8" height="8" rx="1.5" fill="#21918c"/><rect x="1" y="11" width="8" height="8" rx="1.5" fill="#5ec962"/><rect x="11" y="11" width="8" height="8" rx="1.5" fill="#fde725"/></svg>
    </div>
    <div class="title-block">
      <div class="crumbs"><span>Trajectory coverage</span><span class="sep">›</span><span data-v5-crumb-dataset></span></div>
      <h1 data-v5-title></h1>
    </div>
    <p class="subtitle" data-v5-subtitle></p>
    <div class="top-actions">
      <button type="button" class="gear" data-v5-gear aria-label="Settings" aria-haspopup="dialog" aria-expanded="false" title="Settings — colours and scale for every figure">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 0-.5.4l-.4 2.7a7.6 7.6 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .3.2.5.5.5h4c.3 0 .5-.2.5-.4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6L19.4 13ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
      </button>
    </div>
    <div class="settings" data-v5-settings role="dialog" aria-label="Settings" hidden></div>
  </header>
  <div class="shell">
    <aside class="rail" data-v5-rail aria-label="Trajectories"></aside>
    <div class="rail-handle" data-v5-rail-handle role="separator" aria-orientation="vertical" title="Drag to resize · double-click to reset"></div>
    <main class="main">
      <nav class="tabs" data-v5-tabs role="tablist"></nav>
      <div class="focusbar" data-v5-focusbar></div>
      <div class="content" data-v5-content></div>
    </main>
  </div>
  <div class="tip" data-v5-tip hidden></div>
</div>
<script src="../data/coverage.js"></script>
<script src="../data/trajectories.js"></script>
<script src="../data/membership.js"></script>
<script src="coverage_color.js"></script>
<script src="app.js"></script>
</body>
</html>
