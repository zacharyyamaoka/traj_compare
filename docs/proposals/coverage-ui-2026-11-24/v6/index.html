<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- V6 "Who goes there" (coverage-UI babble round 2026-11-24): every figure is the query. data-round is the round's
     folder, used only to print a copy-able Rerun command when the page cannot ask the server to open it. -->
<body data-round="/home/bam/traj_compare/docs/proposals/coverage-ui-2026-11-24">
<div id="v6-app" class="v6">
  <header class="v6-head">
    <div class="v6-titles">
      <div class="v6-crumb">traj_compare · trajectory coverage</div>
      <h1 id="v6-title">Trajectory coverage</h1>
      <p id="v6-subtitle"></p>
    </div>
    <button id="v6-gear" class="v6-gear" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="v6-settings"
            title="Settings — colours and scale for every figure">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.3 7.3 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .2.3.4.5.4h4c.2 0 .5-.2.5-.4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6L19.4 13ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
      <span>Settings</span>
    </button>
    <div id="v6-settings" class="v6-settings" role="dialog" aria-label="Settings" hidden>
      <div class="v6-set-head"><b>Settings</b><span>apply to every figure, remembered</span>
        <button id="v6-settings-close" class="v6-x" type="button" aria-label="Close settings">✕</button></div>
      <label class="v6-set-row"><span class="v6-set-label">Colours</span>
        <select id="v6-cmap"><option value="viridis">viridis</option><option value="magma">magma</option><option value="plasma">plasma</option><option value="inferno">inferno</option><option value="cividis">cividis</option></select>
        <span class="v6-ramp" id="v6-ramp"></span></label>
      <label class="v6-set-row"><span class="v6-set-label"></span><input type="checkbox" id="v6-reverse"> Reverse (high = dark)</label>
      <label class="v6-set-row"><span class="v6-set-label">Scale</span>
        <select id="v6-scale"><option value="linear">linear (clipped at p98)</option><option value="log">log</option><option value="equalized">histogram-equalized</option><option value="visited">visited / not</option><option value="enough">≥ enough samples / not</option></select></label>
      <p class="v6-set-note" id="v6-scale-note"></p>
      <label class="v6-set-row"><span class="v6-set-label">Cells count</span>
        <select id="v6-count"><option value="paths">trajectories per cell</option><option value="samples">samples per cell</option></select></label>
      <p class="v6-set-note">Trajectories per cell matches the question every cell answers: how many made it, and (click) which.</p>
    </div>
  </header>
  <div class="v6-bar">
    <nav class="v6-tabs" id="v6-tabs" role="tablist" aria-label="Focus"></nav>
    <div class="v6-query" id="v6-querybar" aria-live="polite"></div>
  </div>
  <div class="v6-main" id="v6-main">
    <main class="v6-views" id="v6-views"></main>
    <aside class="v6-dock" id="v6-dock" aria-label="Who goes there"></aside>
  </div>
  <aside id="v6-drill" class="v6-drill" aria-label="One trajectory" hidden></aside>
  <div class="v6-tip" id="v6-tip" hidden></div>
</div>
<script src="../data/coverage.js"></script>
<script src="../data/membership.js"></script>
<script src="../data/trajectories.js"></script>
<script src="coverage_color.js"></script>
<script src="v6.js"></script>
</body>
</html>
