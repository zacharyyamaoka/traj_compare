<!doctype html>
<!-- P5 embedded: the SAME parts and markup as index.html, mounted in the host's 1000 x 680 slot. The scope is narrower
     than 1100 px, so its container queries fold the rail to a "Filters" chip (its panel opens inside the scope); the tabs
     stay. A fake host app for check P4 (2026-11-24): the component must live inside #host-slot (1000 x 680) and draw nothing
     outside it. Copy this file to p<N>/embed.html and mount your component in #host-slot; keep the host's own parts. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Host app · P5 embedded</title>
<link rel="stylesheet" href="../vendor/data-ui/data-ui.css">
<link rel="stylesheet" href="css/parts.css">
<link rel="stylesheet" href="css/coverage.css">
<link rel="stylesheet" href="css/layout.css">
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #eef0f3; color: #1f2328; }
  #host-header { height: 48px; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: #1f2937; color: #fff; }
  #host-header b { font-size: 15px; }
  #host-main { display: flex; }
  #host-sidebar { width: 200px; min-height: calc(100vh - 48px); background: #fff; border-right: 1px solid #d0d7de; padding: 12px; box-sizing: border-box; }
  #host-sidebar div { padding: 6px 8px; border-radius: 6px; color: #57606a; }
  #host-sidebar div.on { background: #eef2ff; color: #1f2328; }
  #host-content { padding: 20px; }
  #host-content h2 { margin: 0 0 12px; font-size: 16px; }
  #host-slot { width: 1000px; height: 680px; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; overflow: hidden; position: relative; }
  /* the host gives the component its slot; nothing else */
  #host-slot > data-scope { height: 100%; }
</style>
</head>
<body>
<div id="host-header"><b>Host app</b><span>Robots</span><span>Datasets</span><span>Reports</span></div>
<div id="host-main">
  <nav id="host-sidebar"><div>UR5e</div><div class="on">Trajectory coverage</div><div>Pick loop</div><div>Notes</div></nav>
  <main id="host-content">
    <h2>UR5e trajectory coverage (embedded)</h2>
    <div id="host-slot">
<data-scope id="coverage-embed">
  <div class="p5-frame">
    <data-fold label="Filters" data-resizable="right" data-resizable-min="200" data-resizable-max="440" data-resizable-key="p5-rail">
      <header class="p5-title">
        <h1>UR5e trajectory datasets</h1>
        <p>4 datasets · dev + holdout at full speed · 212 trajectories</p>
      </header>
      <data-facets data-resizable="off"></data-facets>
    </data-fold>
    <div class="p5-bar">
      <data-tabs aria-label="Coverage dashboards"></data-tabs>
      <data-count noun="trajectory"></data-count>
      <data-settings></data-settings>
    </div>
    <div class="p5-pages">
      <data-dashboard tab="Overview"></data-dashboard>
      <data-dashboard tab="One joint"></data-dashboard>
      <data-dashboard tab="Tool position"></data-dashboard>
      <data-dashboard tab="Tool orientation"></data-dashboard>
      <data-views tab="Trajectories" view="Trajectories" toolbar="none" open="side"></data-views>
    </div>
  </div>
</data-scope>
</div>
  </main>
</div>
<script src="js/coverage/coverage_color.js"></script>
<script src="../data/coverage.js"></script>
<script src="../data/trajectories.js"></script>
<script src="../data/membership.js"></script>
<script src="../data/datasets.js"></script>
<script type="module">
  import { start } from './js/app.js';
  start();
</script>
</body>
</html>
