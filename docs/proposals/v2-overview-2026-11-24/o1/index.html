<!doctype html>
<!-- O1 "The League, back, over the rail" (V2 with its Overview redone) (traj_compare Dataset → Target → Run round, 2026-11-24): ONE stock data-ui <data-workbench> over every
     run of every bench deployment (views.base, generated by ../build_rows.py); host.js adds only this variant's link to
     the target view (common/target.html) and what NOTES.md names as data-ui gaps. Served: serve_round.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>traj_compare · O1 The League, back, over the rail</title>
<link rel="stylesheet" href="../vendor/data-ui/data-ui.css">
<style>
  html, body { margin: 0; }
  body { font: 14px/1.4 system-ui, sans-serif; background: #fff; color: #1f2328; overflow-x: hidden; }
  #host { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 14px; box-sizing: border-box; min-width: 0; }
  #host h1 { font-size: 14.5px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
  #host button { font: inherit; font-size: 12.5px; padding: 3px 8px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; color: inherit; cursor: pointer; white-space: nowrap; }
  #warn { font-size: 12.5px; color: #7d4e00; background: #fff8c5; border: 1px solid #eac54f; border-radius: 6px; padding: 2px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
  #host .sp { flex: 1; }
  #tc .dw-frame > data-fold[fold="always"] { width: auto; padding: 8px 6px 0 8px; border-right: 0; }
  #tc .dw-frame > data-fold[fold="always"] + .dw-rail-handle { display: none !important; }
  data-workbench { display: block; --data-height: calc(100vh - 40px); }
  @media (prefers-color-scheme: dark) {
    body { background: #111113; color: #e6edf3; }
    #host button { background: #161b22; border-color: #30363d; }
    #warn { color: #e3b341; background: #272115; border-color: #6c5418; }
  }
</style>
</head>
<body>
<header id="host">
  <button type="button" id="fold" aria-pressed="false" title="Fold the filter rail to a chip (the stock fold=&quot;always&quot;)">⟨ Fold filters</button>
  <h1 title="traj_compare · every deployment · O1 The League, back, over the rail">traj_compare · every deployment <span style="font-weight:400;color:#6e7781">· O1 The League, back, over the rail</span></h1>
  <span id="warn" role="status" hidden></span>
  <span class="sp"></span>
</header>
<data-workbench id="tc" src="views.base" aria-label="Trajectory comparison"></data-workbench>
<script type="module" src="../vendor/data-ui/data-ui.js"></script>
<script type="module" src="host.js"></script>
</body>
</html>
