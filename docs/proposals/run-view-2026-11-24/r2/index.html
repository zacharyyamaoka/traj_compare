<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Playback viewer · R2 One timeline for the page</title>
<link rel="stylesheet" href="/assets/uplot.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../common/runview.css">
</head>
<body data-rv-variant="r2">
<!-- R2 "One timeline for the page": a video-editor page. ONE time control (the time lane docked under the question tabs:
     transport, a ruler on the charts' exact x pixels, one track per run with its moments, a zoom bar) and ONE playhead
     line through every chart; charts stacked one per row, full width, on the same x pixels.
     ?fixture=tta|bam_fb [&keep=<names or bench lines>] [&back=<target view url>] [&t=<s>] [#tab=<id>] [&dry=1] -->
<header class="tc rv-head" id="rv-head"></header>
<nav class="tc-tabs" id="tc-tabs"></nav>
<nav class="tc-subtabs" id="tc-subtabs"></nav>
<main class="tc" id="tc-main"></main>
<footer class="tc" id="rv-foot"></footer>
<script src="/assets/uplot.iife.min.js"></script>
<script src="/assets/three.min.js"></script>
<script src="/assets/viewhelper.js"></script>
<script src="viewer3d.js"></script>
<script src="plots.js"></script>
<script src="timeline.js"></script>
<script>
  // RV: R2's page is an app (header · stage + tabs · docked lane): the provenance line moves to the end of the charts
  window.RunViewVariant = {
    afterBoot: function () {
      var foot = document.getElementById('rv-foot'), sheet = document.querySelector('.tc-page.active .rv-sheet');
      if (foot && sheet) { foot.classList.add('rv-foot-in-sheet'); sheet.appendChild(foot); }
    },
  };
</script>
<script src="../common/runview.js"></script>
</body>
</html>
