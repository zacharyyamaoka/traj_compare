<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Playback viewer · R5 Moments first</title>
<link rel="stylesheet" href="/assets/uplot.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../common/runview.css">
</head>
<body data-rv-variant="r5">
<!-- R5 "Moments first": the page's first question is "when was it worst?". It opens at the worst moment, lists the
     moments worth seeing beside the 3D (jump, [ / ] step, the drag snaps to them), and at the playhead shows every
     shown run at once: a readout table under every chart (value and Δ to the target, sorted by |Δ|) and every run's
     arm as a ghost in the 3D, the focus run solid.
     ?fixture=tta|bam_fb [&keep=<names or bench lines>] [&back=<target view url>] [&t=<s>] [#tab=<id>] [&dry=1] -->
<header class="tc rv-head" id="rv-head"></header>
<nav class="tc-tabs" id="tc-tabs"></nav>
<nav class="tc-subtabs" id="tc-subtabs"></nav>
<main class="tc" id="tc-main"></main>
<footer class="tc" id="rv-foot"></footer>
<script src="/assets/uplot.iife.min.js"></script>
<script src="/assets/three.min.js"></script>
<script src="/assets/viewhelper.js"></script>
<script src="viewer3d.js"></script>
<script src="plots.js"></script>
<script src="../common/runview.js"></script>
</body>
</html>
