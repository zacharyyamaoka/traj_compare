[build-system]
# WHY >=1.27: the first hatchling that writes PEP 639 metadata (robot_models' template, as robot_trajectories).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "traj-compare"
version = "0.1.0"
description = "Turn-key A/B trajectory comparison viewer: joint + TCP + path-progress channels and an interactive 3D path viewer, rendered as one self-contained static HTML file."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zach Yamaoka" }]
requires-python = ">=3.11"
keywords = ["robotics", "trajectory", "comparison", "sim2real", "coverage", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy>=1.26",
  # WHY robot_msgs: every error signal and error statistic comes from robot_msgs.compare, so the
  # report and the library can never disagree (one source of truth). numpy is its only runtime dependency.
  "robot-msgs>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/zacharyyamaoka/traj_compare"
Repository = "https://github.com/zacharyyamaoka/traj_compare"

[project.optional-dependencies]
test = ["pytest>=8", "scipy>=1.10"]
# WHY pinned exactly: an .rrd must be opened by a viewer at least as new as the SDK that wrote it, so the
# report writes this one version beside every file (Tracking-Run Data — data-ui vs Rerun, 2026-10-26).
# WHY robot-msgs[rerun]: the standard parts (joint series, errors, bands, links, video) are logged by
# robot_msgs.viz.rerun, so a traj_compare .rrd and a msg.show() recording share one entity layout.
rerun = ["rerun-sdk==0.40.0", "robot-msgs[rerun]"]
# WHY optional: the core stays numpy + robot-msgs; Parquet (tidy rows) and MCAP (JSON topics) are two more
# projections of the same payload, for pandas / LeRobot and PlotJuggler / Foxglove (prior-art item 10, 2026-11-10).
export = ["pyarrow>=15", "mcap>=1.2"]
# WHY three more extras: the coverage viewers (docs/COVERAGE.md) read one payload; each tool is imported only inside
# its own module, so the core stays numpy + robot-msgs (Zach 2026-11-23: "Matplot lib, Viser, weights and biases,
# OUr own custom viewer"). viser through the house viser_3d_viewer (no logo, ViewCube, asserted ports).
plot = ["matplotlib>=3.8"]
viser = ["viser-3d-viewer"]
wandb = ["wandb>=0.19"]

[tool.uv.sources]
# WHY absolute: traj_compare is its own repo since 2026-11-20 (Zach: "robot_msgs [is] primarily about data ... this is
# getting more involved so let's give it its own package"), a leaf on robot_msgs beside it, as robot_trajectories does.
# bam_ws reaches it through src/external/traj_compare (and a symlink at its old path), so a relative path would mean
# something different from each place; /home/bam/<repo> is the convention every sibling (and the cloud setup) uses.
robot-msgs = { path = "/home/bam/robot_msgs", editable = true }
viser-3d-viewer = { path = "/home/bam/viser-3d-viewer", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/traj_compare"]

# WHY only-include: hatchling's sdist takes every non-ignored file, and the checkout holds agent worktrees
# (.claude/worktrees, with wandb symlinks out of the tree) and review rounds under docs/ (84 MB, 2026-11-24).
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
