[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traj-compare"
version = "0.1.0"
description = "Turn-key A/B trajectory comparison viewer: joint + TCP + path-progress channels and an interactive 3D path viewer, rendered as one self-contained static HTML file."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8", "scipy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/traj_compare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
