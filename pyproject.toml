[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traj-compare"
version = "0.1.0"
description = "Turn-key A/B trajectory comparison viewer: joint + TCP + path-progress channels and an interactive 3D path viewer, rendered as one self-contained static HTML file."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  # WHY robot_msgs: every error signal and error statistic comes from robot_msgs.compare, so the
  # report and the library can never disagree (one source of truth). numpy is its only runtime dependency.
  "robot-msgs",
]

[project.optional-dependencies]
test = ["pytest>=8", "scipy>=1.10"]
# WHY pinned exactly: an .rrd must be opened by a viewer at least as new as the SDK that wrote it, so the
# report writes this one version beside every file (Tracking-Run Data — data-ui vs Rerun, 2026-10-26).
# WHY robot-msgs[rerun]: the standard parts (joint series, errors, bands, links, video) are logged by
# robot_msgs.viz.rerun, so a traj_compare .rrd and a msg.show() recording share one entity layout.
rerun = ["rerun-sdk==0.40.0", "robot-msgs[rerun]"]
# WHY optional: the core stays numpy + robot-msgs; Parquet (tidy rows) and MCAP (JSON topics) are two more
# projections of the same payload, for pandas / LeRobot and PlotJuggler / Foxglove (prior-art item 10, 2026-11-10).
export = ["pyarrow>=15", "mcap>=1.2"]

[tool.uv.sources]
# WHY absolute: traj_compare is its own repo since 2026-11-20 (Zach: "robot_msgs [is] primarily about data ... this is
# getting more involved so let's give it its own package"), a leaf on robot_msgs beside it, as robot_trajectories does.
# bam_ws reaches it through src/external/traj_compare (and a symlink at its old path), so a relative path would mean
# something different from each place; /home/bam/<repo> is the convention every sibling (and the cloud setup) uses.
robot-msgs = { path = "/home/bam/robot_msgs", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/traj_compare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
